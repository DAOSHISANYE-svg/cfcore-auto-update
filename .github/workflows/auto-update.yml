name: cfcore Auto Update

# cfcore (byJoey/cfnew 精简内核) 云端自动更新
# 上游: byJoey/cfnew releases | 部署目标: project-name.txt 中记录的 Pages 项目
# 特性: 冒烟失败自动回滚 | 项目被封(8000119)自动转生到新项目并无缝切换域名
# 需要 Secrets: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID (+ LINE_*_UUID 供 monitor.yml)

on:
  schedule:
    # 每天 06:17 UTC（北京时间 14:17），与 CFnew 04:17 / edgetunnel 05:23 错开
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "强制重新部署（忽略 hash 比对）"
        required: false
        default: "false"
        type: string

permissions:
  contents: write
  deployments: write

concurrency:
  group: cfcore-autoupdate
  cancel-in-progress: false

jobs:
  update:
    name: Check & Deploy cfcore
    runs-on: ubuntu-latest

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 查询上游最新版本
        id: rel
        run: |
          VER=$(curl -sS https://api.github.com/repos/byJoey/cfnew/releases/latest | python3 -c "import json,sys;print(json.load(sys.stdin)['tag_name'])")
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "### 上游最新版本: $VER" >> "$GITHUB_STEP_SUMMARY"

      - name: 下载新版 _worker.js
        run: |
          mkdir -p upstream
          curl -sSL --retry 5 -H "Accept: application/vnd.github.raw" \
            -o upstream/_worker.js \
            "https://api.github.com/repos/byJoey/cfnew/contents/_worker.js?ref=${{ steps.rel.outputs.ver }}"
          test -s upstream/_worker.js || { echo "::error::下载的 _worker.js 为空"; exit 1; }
          SIZE=$(wc -c < upstream/_worker.js)
          echo "- 内核大小: ${SIZE} 字节" >> "$GITHUB_STEP_SUMMARY"
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::文件仅 ${SIZE} 字节，明显异常（正常约 37KB）"
            exit 1
          fi

      - name: 计算 hash 并比对
        id: check
        run: |
          NEW=$(sha256sum upstream/_worker.js | cut -d' ' -f1)
          OLD=$(cat deployed-hash.txt 2>/dev/null | tr -d '\n\r' || echo none)
          [ -z "$OLD" ] && OLD="none"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "- 上游 hash: \`${NEW:0:16}…\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- 已部署 hash: \`${OLD:0:16}…\`" >> "$GITHUB_STEP_SUMMARY"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ] || [ "$NEW" != "$OLD" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "### 需要更新" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "### 上游无变化，跳过" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 安装 wrangler（固定 v4 主版本，避免上游破坏性更新）
        if: steps.check.outputs.needed == 'true'
        run: npm install -g wrangler@4 --silent

      - name: 记录部署前版本（用于失败回滚）
        id: old_deploy
        if: steps.check.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          PROJECT=$(cat project-name.txt)
          OLD_DEPLOY=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments?per_page=1" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['result'][0]['id'])" 2>/dev/null || echo "")
          echo "old_deploy=$OLD_DEPLOY" >> "$GITHUB_OUTPUT"
          echo "- 部署前版本 ID: ${OLD_DEPLOY:-无}" >> "$GITHUB_STEP_SUMMARY"

      - name: 部署到 Cloudflare Pages
        id: deploy
        if: steps.check.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          mkdir -p dist && cp upstream/_worker.js dist/_worker.js
          PROJECT=$(cat project-name.txt)
          echo "project=$PROJECT" >> "$GITHUB_OUTPUT"
          echo "- 部署目标: $PROJECT" >> "$GITHUB_STEP_SUMMARY"
          set +e
          OUT=$(wrangler pages deploy dist --project-name="$PROJECT" --branch=main --commit-dirty=true 2>&1)
          RC=$?
          set -e
          echo "$OUT"
          if [ $RC -ne 0 ]; then
            if echo "$OUT" | grep -q "8000119"; then
              echo "blocked=true" >> "$GITHUB_OUTPUT"
              echo "::warning::项目 $PROJECT 已被 CF 封禁(8000119)，启动转生流程"
            else
              echo "::error::$OUT"
              exit 1
            fi
          else
            echo "blocked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 封禁转生（自动迁移到新项目）
        id: rescue
        if: steps.deploy.outputs.blocked == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OLD_PROJECT: ${{ steps.deploy.outputs.project }}
          DIST_DIR: dist
        run: bash scripts/rescue.sh

      - name: 同步部署备份线 cfnew
        if: steps.check.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy dist --project-name=cfnew --branch=main --commit-dirty=true

      - name: 冒烟测试（失败自动回滚）
        if: steps.check.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BLOCKED: ${{ steps.deploy.outputs.blocked }}
          OLD_DEPLOY: ${{ steps.old_deploy.outputs.old_deploy }}
        run: |
          sleep 20
          PROJECT=$(cat project-name.txt)
          SUB=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT" \
            | python3 -c "import json,sys;print(json.load(sys.stdin)['result']['subdomain'])")
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" "https://$SUB" || echo "000")
          echo "- 冒烟测试 https://$SUB → HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" != "200" ]; then
            if [ "$BLOCKED" != "true" ] && [ -n "${{ steps.old_deploy.outputs.old_deploy }}" ]; then
              echo "::error::冒烟失败(HTTP $CODE)，自动回滚到部署前版本"
              curl -sS -X POST -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
                "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/pages/projects/$PROJECT/deployments/${{ steps.old_deploy.outputs.old_deploy }}/rollback"
            fi
            exit 1
          fi

      - name: 优选生效校验（部署后）
        if: steps.check.outputs.needed == 'true'
        env:
          LINE_BC_UUID: ${{ secrets.LINE_BC_UUID }}
        run: |
          sleep 10
          YX=$(curl -sS --max-time 25 "https://cfcore-6ha.pages.dev/$LINE_BC_UUID/api/config" | python3 -c "import json,sys;print(json.load(sys.stdin).get('yxURL',''))" 2>/dev/null || echo "")
          if [ -n "$YX" ]; then
            echo "- ✅ 优选源生效: $YX" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ 部署后 yxURL 未生效（内核可能变更配置读取方式），请检查节点速度" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::优选源校验未通过"
          fi

      - name: 记录已部署 hash
        if: steps.check.outputs.needed == 'true'
        run: |
          echo "${{ steps.check.outputs.new }}" > deployed-hash.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployed-hash.txt
          git commit -m "chore: cfcore auto-update ${{ steps.rel.outputs.ver }}" || true
          git push || echo "::warning::hash 记录提交失败（不影响已部署站点）"
