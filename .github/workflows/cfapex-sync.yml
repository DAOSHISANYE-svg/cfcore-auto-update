name: cfapex Update

# cfapex (CFAPEX 面板内核) 自动更新：跟踪上游 CFAPEX-Pages zip 的内容 hash
# 面板入口与订阅令牌不落仓库（冒烟只用根路径 200）

on:
  schedule:
    - cron: "23 9 * * *"   # 每日 09:23 UTC（北京时间 17:23）
  workflow_dispatch:
    inputs: {}

permissions:
  contents: write

jobs:
  update:
    name: 更新 cfapex
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载上游内核并比对
        id: check
        run: |
          mkdir -p upstream dist
          curl -sSL --retry 5 -H "Accept: application/vnd.github.raw" \
            -o upstream/cfapex.zip \
            "https://api.github.com/repos/shitouxiaoge-commits/CFAPEX/contents/CFAPEX-Pages-1.4.zip" || true
          python3 scripts/extract-cfapex.py
          test -s upstream/_worker.js || { echo "::error::提取失败"; exit 1; }
          SIZE=$(wc -c < upstream/_worker.js)
          echo "- 内核大小: ${SIZE} 字节" >> "$GITHUB_STEP_SUMMARY"
          [ "$SIZE" -gt 100000 ] || { echo "::error::文件仅 ${SIZE} 字节，异常"; exit 1; }
          NEW=$(sha256sum upstream/_worker.js | cut -d' ' -f1)
          OLD=$(cat deployed-hash.txt 2>/dev/null | tr -d '\n\r' || echo none)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "- 上游内核 hash: \`${NEW:0:16}…\`" >> "$GITHUB_STEP_SUMMARY"
          FORCE="${{ github.event.inputs.force }}"
          if [ "$FORCE" = "true" ] || [ "$NEW" != "$OLD" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"; echo "### 需要更新" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"; echo "### 无变化" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: 部署
        if: steps.check.outputs.needed == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cp upstream/_worker.js dist/_worker.js
          npm install -g wrangler@4 --silent
          # 项目级 env (A) 与 KV 绑定 (K) 在 Cloudflare 侧配置，自动继承
          wrangler pages deploy dist --project-name=cfapex --branch=main --commit-dirty=true

      - name: 冒烟测试
        if: steps.check.outputs.needed == 'true'
        run: |
          sleep 20
          CODE=$(curl -sS -o /dev/null -w "%{http_code}" --max-time 25 "https://cfapex-2bl.pages.dev" || echo "000")
          echo "- 冒烟 HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"
          [ "$CODE" = "200" ] || { echo "::error::冒烟失败 HTTP $CODE"; exit 1; }

      - name: 优选生效校验（部署后）
        if: steps.check.outputs.needed == 'true'
        env:
          SUB_TOKEN_E: ${{ secrets.SUB_TOKEN_E }}
        run: |
          sleep 10
          N=$(curl -sS --max-time 25 "https://cfapex-2bl.pages.dev/s/$SUB_TOKEN_E" | grep -c 'vless://' || echo 0)
          if [ "${N:-0}" -ge 10 ] && [ "${N:-0}" -le 100 ]; then
            echo "- ✅ 优选池生效: ${N} 条（cfopt 实测池）" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- ⚠️ 订阅条数 ${N:-0}（cfopt 池应约 24 条；若为 234 则回退内置池）" >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::优选池校验异常，请人工检查节点速度"
          fi

      - name: 记录 hash
        if: steps.check.outputs.needed == 'true'
        run: |
          echo "${{ steps.check.outputs.new }}" > deployed-hash.txt
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deployed-hash.txt
          git commit -m "chore: cfapex auto-update" || true
          git push || echo "::warning::hash 提交失败"
