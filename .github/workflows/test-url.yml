name: Test URL

# 全球视角单 URL 测试工具（手动触发，输入任意 URL）

on:
  workflow_dispatch:
    inputs:
      url:
        description: "要测试的 URL"
        required: true
        type: string
      grep_pattern:
        description: "在响应体中 grep 的模式（可选）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
      - name: 全球视角测试
        run: |
          echo "测试: ${{ github.event.inputs.url }}"
          for i in 1 2 3; do
            CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 25 "${{ github.event.inputs.url }}" 2>/dev/null || echo "000")
            echo "尝试 $i: HTTP $CODE"
            [ "$CODE" != "000" ] && break
            sleep 3
          done
          echo "### 结果: HTTP $CODE" >> "$GITHUB_STEP_SUMMARY"
          echo "--- 响应头 ---"
          curl -sSI --max-time 25 "${{ github.event.inputs.url }}" 2>/dev/null | head -8
          echo "--- 响应体前 200 字 ---"
          head -c 200 /tmp/body.txt 2>/dev/null
          GP="${{ github.event.inputs.grep_pattern }}"
          if [ -n "$GP" ]; then
            echo "--- grep 匹配（$GP）---"
            grep -oE "$GP" /tmp/body.txt 2>/dev/null | head -20 || echo "(无匹配)"
            echo "--- body 前 1500 字 ---"
            head -c 1500 /tmp/body.txt 2>/dev/null
          fi
          exit 0

      - name: 重注册 wzdata-check（借道 git push）
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          printf '
# re-registration touch %s
' "$(date -u +%s)" >> .github/workflows/wzdata-check.yml
          git add .github/workflows/wzdata-check.yml
          git commit -m "chore: re-register wzdata-check" || echo "(无变化)"
          git push
