name: Refresh ADD.txt

# 线路 A (warpzhuanyong) 优选 IP 库自动刷新
# 数据源: ip.164746.xyz + ymyuuu/IPDB → 写入 KV ADD.txt (每周一刷新)

on:
  schedule:
    - cron: "33 7 * * 1"   # 每周一 07:33 UTC（北京时间 15:33）
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: 刷新线路A优选库
    runs-on: ubuntu-latest
    steps:
      - name: 拉取优选数据源
        run: |
          curl -sSL --max-time 30 "curl -sSL --max-time 30 -H "Accept: application/vnd.github.raw" \n            -o src0.txt "https://api.github.com/repos/K775KK/cfopt/contents/result.txt" || echo "" > src0.txt
https://ip.164746.xyz/ipTop10.html" -o src1.txt || echo "" > src1.txt
          curl -sSL --max-time 30 -H "Accept: application/vnd.github.raw" \
            -o src2.txt "https://api.github.com/repos/ymyuuu/IPDB/contents/BestCF/bestcfv4.txt" || echo "" > src2.txt
          # 合并去重（纯 IP）
          cat src0.txt src1.txt src2.txt | tr ',' '\n' | tr -d '\r' | sed 's/#.*//' | awk '{$1=$1};1' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$' | awk '!seen[$0]++' > ips.txt
          COUNT=$(wc -l < ips.txt)
          echo "- 获取去重后优选 IP: ${COUNT} 个" >> "$GITHUB_STEP_SUMMARY"
          [ "$COUNT" -ge 5 ] || { echo "::error::优选源数据不足（仅 ${COUNT} 个）"; exit 1; }

      - name: 生成并写入 KV ADD.txt
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # 官方 TLS 端口轮换方案
          PORTS=(2096 8443 2087 2053 443)
          > addtxt.txt
          i=0
          while read -r ip; do
            [ -z "$ip" ] && continue
            echo "${ip}:${PORTS[$((i % 5))]}#CF官方优选$((i+1))" >> addtxt.txt
            i=$((i+1))
            [ "$i" -ge 12 ] && break
          done < ips.txt
          NS="85ac331e6bcf449cbebe5084f959402b"
          HTTP=$(curl -sS -o put_resp.json -w "%{http_code}" -X PUT \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            -H "Content-Type: text/plain; charset=UTF-8" \
            --data-binary "@addtxt.txt" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS/values/ADD.txt")
          echo "- KV 写入 HTTP $HTTP" >> "$GITHUB_STEP_SUMMARY"
          [ "$HTTP" = "200" ] || { echo "::error::KV 写入失败"; cat put_resp.json; exit 1; }

      - name: 回读验证
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          NS="85ac331e6bcf449cbebe5084f959402b"
          VERIFY=$(curl -sS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/storage/kv/namespaces/$NS/values/ADD.txt")
          LINES=$(echo "$VERIFY" | grep -c 'CF官方优选')
          echo "- 回读验证: ${LINES} 条优选条目" >> "$GITHUB_STEP_SUMMARY"
          [ "$LINES" -ge 5 ] || { echo "::error::回读验证失败"; exit 1; }
          echo "### ✅ 线路A优选库已刷新" >> "$GITHUB_STEP_SUMMARY"
