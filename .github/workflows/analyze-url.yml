name: Analyze URL

# 抓取任意文本内容并按模式分析（手动触发）

on:
  workflow_dispatch:
    inputs:
      url:
        description: "要抓取的 URL"
        required: true
        type: string
      pattern:
        description: "分析模式（grep -nE）"
        required: true
        type: string

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - name: 抓取并分析
        run: |
          curl -sSL --retry 5 --max-time 120 -H "Accept: application/vnd.github.raw" \
            -o /tmp/content.txt "${{ github.event.inputs.url }}"
          SIZE=$(wc -c < /tmp/content.txt)
          echo "### 内容大小: $SIZE 字节" >> "$GITHUB_STEP_SUMMARY"
          echo "### 匹配行（含上下文）:" >> "$GITHUB_STEP_SUMMARY"
          grep -nE -C1 "${{ github.event.inputs.pattern }}" /tmp/content.txt > /tmp/matches.txt 2>/dev/null || echo "(无匹配)" >> "$GITHUB_STEP_SUMMARY"
          wc -l < /tmp/matches.txt
          # 分段输出（摘要上限 1024KB）
          split -l 400 /tmp/matches.txt chunk_
          for f in chunk_*; do
            {
              echo '```'
              head -c 40000 "$f"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          done
