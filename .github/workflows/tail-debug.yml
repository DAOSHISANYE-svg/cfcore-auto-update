name: Tail Debug

# 在 Actions 内运行 wrangler tail 抓取 Worker 实时异常（绕过本地网络限制）

on:
  workflow_dispatch:
    inputs:
      worker:
        description: "Worker 名称"
        required: true
        type: string
      url:
        description: "触发请求的 URL"
        required: true
        type: string

permissions:
  contents: read

jobs:
  tail:
    runs-on: ubuntu-latest
    steps:
      - name: 安装并抓取异常
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npm install -g wrangler@4 --silent
          (npx wrangler tail "${{ github.event.inputs.worker }}" --format pretty > tail_out.txt 2>&1 &)
          sleep 22
          for p in "/" "/xhttp" "/favicon.ico"; do
            CODE=$(curl -sS -o /tmp/body.txt -w "%{http_code}" --max-time 20 "${{ github.event.inputs.url }}$p" 2>/dev/null || echo "CURLERR")
            echo ">>> 请求 $p → HTTP $CODE"
            head -c 120 /tmp/body.txt 2>/dev/null
            echo ""
            sleep 4
          done
          sleep 12
          echo "=========== TAIL 输出 ==========="
          cat tail_out.txt
